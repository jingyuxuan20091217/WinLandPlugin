name: Build marketplace index

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'tools/build-index.ps1'
      - '.github/workflows/build-index.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - 'tools/**'
      - '.github/workflows/build-index.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # PR: validate plugin folders only (manifest, package consistency, hashes, logo). No files written.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate plugins
        shell: powershell
        run: .\tools\build-index.ps1 -CheckOnly

  # main: regenerate index.json and the README plugin table, then commit them back.
  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build index.json and README table (keep logos as separate files)
        shell: powershell
        run: .\tools\build-index.ps1

      - name: Commit generated files
        shell: powershell
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json README.md
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: rebuild plugin index"
            git push
            Write-Output "index.json / README.md updated"
          } else {
            Write-Output "no changes"
          }
